<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <script src="js/page-lang.js?v=2026-10-09.4"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="See how body position changes a skydiver's flight in freefall." data-i18n-attr="content: freefall.meta.description">
  <title>Freefall Simulator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2026-10-09.4">
  <link rel="stylesheet" href="css/freefall.css?v=2026-10-09.4">
  <script type="module" src="js/freefall/main.js?v=2026-10-09.4"></script>
</head>
<body>
  <!-- Text below is replaced from i18n/<locale>.json on load (see data-i18n attributes). -->
  <main class="ff-main">
    <header class="page-top">
      <h1 class="page-title"><span data-i18n="freefall.heading.line1">Body position</span><br><span data-i18n="freefall.heading.line2">in freefall</span></h1>
      <nav class="site-nav" data-site-nav></nav>
    </header>
    <p class="intro" data-i18n="freefall.intro"></p>

    <!-- Scene and buttons side by side on wide screens; on phones the scene stays on screen above the buttons. -->
    <div class="ff-layout">
      <div class="ff-stage">
        <div class="ff-scene-box">
          <div id="scene" class="ff-scene"></div>
          <div id="motion-note" class="ff-motion-note" hidden>
            <p data-i18n="freefall.motionNote.text">Animation paused because your system asks for less motion on screen.</p>
            <button id="motion-start" class="ff-action" type="button" data-i18n="freefall.motionNote.start">Start animation</button>
          </div>
          <!-- First visit: what to try first. -->
          <div id="ff-tip" class="ff-tip" hidden>
            <p><strong data-i18n="freefall.tip.label">Tip:</strong> <span id="ff-tip-text"></span></p>
            <button id="ff-tip-try" class="ff-action" type="button" data-i18n="freefall.tip.try">Try it</button>
            <button id="ff-tip-close" class="ff-tip-close" type="button" data-i18n-attr="aria-label: freefall.tip.close; title: freefall.tip.close">✕</button>
          </div>
          <!-- Phones: the explanation of the position just turned on, briefly, where the eyes are.
               Screen readers already hear it from the caption below, so it is hidden from them. -->
          <p id="ff-flash" class="ff-flash" aria-hidden="true" hidden></p>
        </div>
        <div class="ff-readout">
          <p><span class="ff-readout-label" data-i18n="freefall.status.label">Movement</span> <strong id="movement"></strong></p>
        </div>
      </div>

      <div class="ff-panel">
        <div id="controls" class="ff-controls"></div>
        <div class="ff-actions">
          <button id="reset" class="ff-action" type="button" data-i18n="freefall.reset">Neutral position</button>
          <button id="pause" class="ff-action" type="button" aria-pressed="false" data-i18n="freefall.pause">Pause</button>
        </div>
      </div>

      <div class="ff-caption" id="caption" aria-live="polite"></div>
    </div>
  </main>

  <footer>
    <p class="disclaimer" role="note" data-i18n="freefall.disclaimer"></p>
  </footer>

  <noscript><p class="noscript">This simulator needs JavaScript. / Este simulador precisa de JavaScript para funcionar.</p></noscript>
</body>
</html>
