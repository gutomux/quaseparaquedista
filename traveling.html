    <section id="pode" aria-labelledby="pode-title">
      <h2 id="pode-title" data-i18n="travel.can.title"></h2>

        <table>
          <thead>
            <tr><td></td><th scope="col">CYPRES</th><th scope="col">Vigil</th><th scope="col">MarS M2</th></tr>

              <td data-i18n-rich="travel.aad.parts.mars"></td>

            <tr>
              <th scope="row" data-i18n="travel.aad.cutter.label"></th>

              <td data-i18n-rich="travel.aad.print.mars"></td>
            </tr>
          </tbody>
        </table>

        <p data-i18n-rich="travel.aad.sameDay"></p>
      </div>
      <p data-i18n-rich="travel.aad.m2"></p>

        <li>
          <label class="travel-tick"><input type="checkbox" id="check-docs-1"><span data-i18n-rich="travel.docs.1"></span></label>
          <ul>
            <li data-i18n-rich="travel.docs.xray.cypres"></li>
            <li data-i18n-rich="travel.docs.xray.vigil"></li>
            <li data-i18n-rich="travel.docs.xray.mars"></li>

        <li>
          <label class="travel-tick"><input type="checkbox" id="check-docs-3"><span data-i18n-rich="travel.docs.3"></span></label>
