# Every day, look for a new USPA "Skydiver Update" issue and publish it on the newsletter page.
# The script updates data/uspa-update.json only when a new issue is out; this job then commits
# it and asks GitHub Pages to rebuild the site (a push made by this job doesn't start a build).
name: USPA newsletter

on:
  schedule:
    - cron: '17 11 * * *' # every day at 11:17 UTC (08:17 in Brasília)
  workflow_dispatch: # also from the Actions tab: "Run workflow"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for a new issue
        run: node scripts/update-uspa-newsletter.mjs
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/uspa-update.json; then
            echo "No new issue."
            exit 0
          fi
          issue=$(node -p "require('./data/uspa-update.json').issue")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uspa-update.json
          git commit -m "Showing the USPA Skydiver Update of $issue"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
