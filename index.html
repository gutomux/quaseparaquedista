<!DOCTYPE html>
<html lang="en-US">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Skydiving tools for first-timers, students and experienced jumpers." data-i18n-attr="content: home.meta.description">
  <title>QuaseParaquedista</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <!-- Text below is replaced from i18n/<locale>.json on load (see data-i18n attributes). -->
  <main class="home">
    <header class="page-top">
      <h1 class="page-title home-title"><span>Quase</span><span>Paraquedista</span></h1>
      <nav class="site-nav" data-site-nav></nav>
    </header>

    <p class="home-lead" data-i18n="home.lead">Welcome!</p>

    <!-- The tools, first thing below the welcome, so nobody depends on finding the ☰ menu. -->
    <h2 class="sr" data-i18n="home.toolsHeading">Tools</h2>
    <ul class="home-tools">
      <li>
        <a class="home-tool" href="glossary.html">
          <span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg></span>
          <span class="home-tool-text">
            <span class="home-tool-name" data-i18n="nav.menu.glossary.name"></span>
            <span class="home-tool-desc" data-i18n="nav.menu.glossary.text"></span>
          </span>
          <span class="home-tool-arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="home-tool" href="freefall.html">
          <span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5a9 7 0 0 1 18 0"/><path d="M3 10.5 12 19l9-8.5M8.2 10l3.8 9 3.8-9"/><circle cx="12" cy="20.3" r="1.3"/></svg></span>
          <span class="home-tool-text">
            <span class="home-tool-name" data-i18n="nav.menu.freefall.name"></span>
            <span class="home-tool-desc" data-i18n="nav.menu.freefall.text"></span>
          </span>
          <span class="home-tool-arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="home-tool" href="materiais-instrucao.html">
          <span class="icon-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.2 9.5 4.2 12 6c2.5-1.8 5.5-1.8 8-.5v13c-2.5-1.3-5.5-1.3-8 .5-2.5-1.8-5.5-1.8-8-.5z"/><path d="M12 6v13.5"/></svg></span>
          <span class="home-tool-text">
            <span class="home-tool-name" data-i18n="nav.menu.materials.name"></span>
            <span class="home-tool-desc" data-i18n="nav.menu.materials.text"></span>
          </span>
          <span class="home-tool-arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>

    <div class="home-intro">
      <ul class="home-audiences">
        <li>
          <a class="home-audience" href="freefall.html">
            <strong data-i18n="home.audiences.firstTimer.title"></strong> <span data-i18n="home.audiences.firstTimer.text"></span>
            <span class="home-audience-cta"><span data-i18n="home.audiences.firstTimer.cta"></span> <span aria-hidden="true">→</span></span>
          </a>
        </li>
        <li>
          <a class="home-audience" href="materiais-instrucao.html">
            <strong data-i18n="home.audiences.student.title"></strong> <span data-i18n="home.audiences.student.text"></span>
            <span class="home-audience-cta"><span data-i18n="home.audiences.student.cta"></span> <span aria-hidden="true">→</span></span>
          </a>
        </li>
        <li>
          <a class="home-audience" href="#" id="audience-feedback" target="_blank" rel="noopener noreferrer">
            <strong data-i18n="home.audiences.experienced.title"></strong> <span data-i18n="home.audiences.experienced.text"></span>
            <span class="home-audience-cta"><span data-i18n="home.audiences.experienced.cta"></span> <span aria-hidden="true">→</span></span><span class="sr" data-i18n="feedback.newTab"></span>
          </a>
        </li>
      </ul>

      <!-- Photos from the Instagram post, in its order. Add a slide by adding an <img class="carousel-slide">. -->
      <section class="carousel" aria-roledescription="carousel" data-i18n-attr="aria-label: home.carousel.label">
        <a class="carousel-frame" href="https://www.instagram.com/p/DZfUSjYlnWS/" target="_blank" rel="noopener noreferrer">
          <img class="carousel-slide is-active" src="images/carousel/1.jpg" width="1080" height="1350" alt="" data-i18n-attr="alt: home.carousel.slides.1">
          <img class="carousel-slide" src="images/carousel/2.jpg" width="1080" height="1350" alt="" loading="lazy" data-i18n-attr="alt: home.carousel.slides.2">
          <img class="carousel-slide" src="images/carousel/3.jpg" width="1080" height="1350" alt="" loading="lazy" data-i18n-attr="alt: home.carousel.slides.3">
          <span class="sr" data-i18n="home.carousel.open">(opens the post on Instagram in a new tab)</span>
        </a>
        <div class="carousel-controls">
          <div class="carousel-dots"></div>
          <button class="carousel-toggle" type="button" aria-pressed="false" data-i18n="home.carousel.pause">Pause</button>
        </div>
      </section>
    </div>

    <p class="home-instagram">
      <span data-i18n="home.instagram.text">Follow us on Instagram:</span>
      <a href="https://www.instagram.com/quaseparaquedista/" target="_blank" rel="noopener noreferrer">
        @quaseparaquedista<span class="sr" data-i18n="feedback.newTab">(opens in a new tab)</span>
      </a>
    </p>
  </main>

  <footer>
    <p class="disclaimer" role="note" data-i18n="home.disclaimer"></p>
  </footer>

  <aside class="feedback" hidden>
    <p data-i18n="home.feedbackHint">Have an idea or spotted a mistake?</p>
    <a id="feedback" class="feedback-btn" href="#" target="_blank" rel="noopener noreferrer">
      <span data-i18n="home.feedbackButton">Send feedback</span>
      <span class="sr" data-i18n="feedback.newTab">(opens in a new tab)</span>
    </a>
  </aside>
</body>
</html>
